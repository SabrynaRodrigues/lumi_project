<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Role Results</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="Main.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="assets/logoazul.png" alt="Logo" class="logo">
      <span class="header-title">Role Results</span>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <span class="stat-icon"><i class="bi bi-envelope"></i></span>
        <span id="totalAplicacoes" class="stat-number">0</span>
        <span class="stat-label">Total Applications Received</span>
      </div>
      <div class="stat-card">
        <span class="stat-icon"><i class="bi bi-check2"></i></span>
        <span id="totalAprovados" class="stat-number">0</span>
        <span class="stat-label">Total Meeting Minimum Requirements</span>
      </div>
      <div class="stat-card">
        <span class="stat-icon"><i class="bi bi-x"></i></span>
        <span id="totalReprovados" class="stat-number">0</span>
        <span class="stat-label">Total Not Meeting Requirements</span>
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Candidato</th>
            <th>Curriculum</th>
            <th>Resultado</th>
          </tr>
        </thead>
        <tbody id="resultTableBody">
          <tr><td colspan="3">Carregando dados...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="roleResults.js"></script>
</body>
</html>
