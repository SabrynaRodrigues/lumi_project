<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="styleLoginCad.css">
  <link href="https://fonts.googleapis.com/css2?family=Gabarito&display=swap" rel="stylesheet">
</head>

<body>
  <img src="assets/logo.png" alt="Logo" class="logo">
  <div class="card">
    <h2>Create an account</h2>
    <p>Already have an account? <a href="login.html">Login</a></p>

    <form id="cadastro-form">
      <label for="userName" class="labelCadastro">Name</label>
      <input type="text" id="userName" name="userName" placeholder="Enter your Name" autocomplete="username"
        required>

      <label for="email" class="labelCadastro">E-mail</label>
      <input type="email" id="email" name="email" placeholder="Enter your e-mail" autocomplete="email" required>

      <label for="password" class="labelCadastro">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="new-password"
        required>

      <label for="confirm" class="labelCadastro">Confirm password</label>
      <input type="password" id="confirm" name="confirm" placeholder="Confirm your password" autocomplete="new-password"
        required>

      <button type="submit" class="btn">Sign up</button>
    </form>
  </div>

  <script src="cadastro.js"></script>
</body>

</html>
